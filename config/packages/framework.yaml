# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        gc_maxlifetime: 2592000
        cookie_lifetime: 2592000

    #esi: true
    #fragments: true

    rate_limiter:
        apply_raid:
            policy: 'sliding_window'
            limit: 10
            interval: '1 minute'
        join_guild:
            policy: 'sliding_window'
            limit: 5
            interval: '5 minutes'
        create_raid:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        rate_limiter:
            apply_raid:
                limit: 10000
            join_guild:
                limit: 10000
            create_raid:
                limit: 10000
